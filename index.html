<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#10251e">
<title>مصاريفي PRO</title>
<style>
:root{--bg:#f3f6f4;--panel:#fff;--ink:#17251f;--muted:#718078;--green:#087f5b;--green2:#e6f5ee;--red:#d94848;--red2:#fff0f0;--line:#e6ece8;--nav:#10251e;--gold:#b7791f;--shadow:0 8px 28px #18372a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{background:var(--nav);color:#fff;padding:18px max(16px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:11px;color:#a9c8b8;font-weight:500}.top-actions{display:flex;gap:8px}.top button{background:#234437;color:#fff;border:0;border-radius:10px;padding:9px 12px}.layout{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:12px}.navbtn{width:100%;border:0;background:transparent;color:#4b5c53;text-align:right;padding:12px;border-radius:10px;margin:2px 0}.navbtn.active,.navbtn:hover{background:var(--green2);color:var(--green);font-weight:700}.main{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 16px}.pagehead h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--green);color:white}.light{background:var(--green2);color:var(--green)}.danger{background:var(--red2);color:var(--red)}.mutedbtn{background:#edf1ee;color:#405047}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.card .label{font-size:12px;color:var(--muted)}.card strong{display:block;font-size:25px;margin:8px 0 2px;direction:ltr;text-align:right}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel h3{margin:0 0 13px;font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.small{font-size:12px}.bar{height:10px;background:#edf1ee;border-radius:20px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--green);border-radius:20px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{padding:15px 8px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:700}.quick button span{display:block;font-size:22px;margin-bottom:5px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:12px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}.table th{background:#f8faf9;color:#617067;font-weight:700}.table tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;background:#eef2ef;color:#53635a}.pill.in{background:var(--green2);color:var(--green)}.pill.out{background:var(--red2);color:var(--red)}.actions{display:flex;gap:5px}.iconbtn{border:0;border-radius:8px;padding:6px 9px;background:#f0f3f1}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#5d6c63;font-weight:700}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid #dce5df;border-radius:10px;padding:11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.filters input,.filters select{width:auto;min-width:135px}.modal{position:fixed;inset:0;background:#07150fc0;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.dialog{background:#fff;border-radius:18px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}.dialog h2{margin:0 0 12px;font-size:20px}.dialogfoot{display:flex;gap:8px;margin-top:16px}.dialogfoot button{flex:1}.empty{text-align:center;padding:35px;color:var(--muted)}.account{border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0}.notice{padding:12px;border-radius:11px;background:#fff8e8;color:#805b19;font-size:12px;line-height:1.7;margin:12px 0}.hidden{display:none!important}.footnote{text-align:center;color:var(--muted);font-size:11px;padding:20px}.chart{display:flex;align-items:end;gap:8px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line)}.chartcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.chartbars{height:110px;width:100%;display:flex;align-items:end;justify-content:center;gap:3px}.chartbars i{display:block;width:35%;min-height:2px;border-radius:5px 5px 0 0}.chartbars .ci{background:var(--green)}.chartbars .co{background:#e47b7b}.chartcol small{font-size:10px;color:var(--muted)}
@media(max-width:800px){.layout{display:block;padding:12px}.side{position:static;display:flex;overflow:auto;gap:4px;margin-bottom:13px;padding:6px}.navbtn{white-space:nowrap;width:auto;padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{padding:14px}.pagehead h1{font-size:20px}.card strong{font-size:22px}}
@media(max-width:390px){.cards{gap:7px}.card{padding:12px}.card strong{font-size:19px}.top-actions button{padding:8px}.brand{font-size:18px}}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصاريفي PRO">

</head>
<body>
<div class="app">
<header class="top">
 <div class="brand">💰 مصاريفي PRO <small>إدارة أموالك بوضوح</small></div>
 <div class="top-actions"><button onclick="exportBackup()">⬇ نسخة احتياطية</button><button onclick="document.getElementById('restoreFile').click()">⬆ استيراد</button><input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)"></div>
</header>
<div class="layout">
 <aside class="side" id="side">
  <button class="navbtn active" data-page="home" onclick="go('home',this)">🏠 الرئيسية</button>
  <button class="navbtn" data-page="transactions" onclick="go('transactions',this)">📒 العمليات</button>
  <button class="navbtn" data-page="accounts" onclick="go('accounts',this)">👛 الحسابات والخزائن</button>
  <button class="navbtn" data-page="budgets" onclick="go('budgets',this)">🎯 الميزانيات</button>
  <button class="navbtn" data-page="debts" onclick="go('debts',this)">🤝 الديون</button>
  <button class="navbtn" data-page="reports" onclick="go('reports',this)">📊 التقارير</button>
  <button class="navbtn" data-page="settings" onclick="go('settings',this)">⚙️ الإعدادات</button>
 </aside>
 <main class="main" id="main"></main>
</div>
<div class="footnote">مصاريفي PRO • بياناتك محفوظة محليًا على هذا الجهاز والمتصفح</div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<script>
const DBKEY='masarefy_pro_v1', OLDKEYS=['masarefy_final','masarefy_v6','masarefy_v5','masarefy_v4','masarefy_v3','masarefy_v2','m'];
const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultDB=()=>({version:1,transactions:[],accounts:[{id:'cash',name:'النقدية',type:'cash',opening:0},{id:'bank',name:'البنك',type:'bank',opening:0}],budgets:[],debts:[],settings:{currency:'ج.م',categories:{income:['راتب','بيع مواشي','بيع ردة','بيع برسيم','إيجار أرض','بيع محاصيل','أخرى'],expense:['طعام وشراب','مواصلات','فواتير','صحة','تعليم','شراء مواشي','شراء ردة','إيجار أرض زراعية','أعلاف','أدوية بيطرية','عمالة','أخرى']}}});
let db=loadDB(),page='home',editingId=null;
function loadDB(){
 try{
  const saved=localStorage.getItem(DBKEY);
  if(saved){let x=JSON.parse(saved);if(x&&Array.isArray(x.transactions)&&Array.isArray(x.accounts)){let base=defaultDB();return {...base,...x,settings:{...base.settings,...(x.settings||{}),categories:{...base.settings.categories,...(x.settings?.categories||{})}}};}}
  let legacy=null,legacyKey='';
  for(const k of OLDKEYS){const raw=localStorage.getItem(k);if(raw){try{const arr=JSON.parse(raw);if(Array.isArray(arr)){legacy=arr;legacyKey=k;break;}}catch(e){}}}
  const fresh=defaultDB();
  if(legacy){
   fresh.transactions=legacy.filter(x=>x&&Number.isFinite(Number(x.price))&&Number(x.price)>0).map(x=>({id:String(x.id||uid()),type:x.type==='in'?'income':'expense',amount:Number(x.price),description:String(x.name||'بدون وصف'),category:'غير مصنف',accountId:'cash',date:(x.date&&String(x.date).slice(0,10))||today(),note:'مُرحّل من الإصدار القديم',createdAt:x.date||new Date().toISOString(),legacy:true}));
   fresh.migration={from:legacyKey,count:fresh.transactions.length,at:new Date().toISOString()};
  }
  return fresh;
 }catch(e){return defaultDB();}
}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db));$('saveState')?.replaceChildren(document.createTextNode('✓ محفوظ محليًا'));}catch(e){alert('مساحة التخزين غير كافية. صدّر نسخة احتياطية.');}}
function totals(list=db.transactions){return list.reduce((a,t)=>{if(t.type==='income')a.income+=t.amount;else if(t.type==='expense')a.expense+=t.amount;return a;},{income:0,expense:0});}
function accountBalance(id){const a=db.accounts.find(x=>x.id===id);if(!a)return 0;return db.transactions.reduce((s,t)=>{if(t.type==='transfer'){if(t.from===id)s-=t.amount;if(t.to===id)s+=t.amount;}else if(t.accountId===id){if(t.type==='income')s+=t.amount;if(t.type==='expense')s-=t.amount;}return s;},Number(a.opening)||0);}
function netWorth(){return db.accounts.reduce((s,a)=>s+accountBalance(a.id),0);}
function go(p,btn){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderPage();}
function pageHead(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${desc}</div></div>${action}</div>`}
function renderPage(){const m=$('main');if(page==='home')m.innerHTML=homeHTML();if(page==='transactions')m.innerHTML=transactionsHTML();if(page==='accounts')m.innerHTML=accountsHTML();if(page==='budgets')m.innerHTML=budgetsHTML();if(page==='debts')m.innerHTML=debtsHTML();if(page==='reports')m.innerHTML=reportsHTML();if(page==='settings'){m.innerHTML=settingsHTML();renderCategoryLists();}}
function homeHTML(){
 const t=totals(),balance=netWorth(),month=db.transactions.filter(x=>x.date?.slice(0,7)===today().slice(0,7)),mt=totals(month),recent=[...db.transactions].sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,6);
 return `${pageHead('لوحة التحكم','ملخص وضعك المالي حتى الآن',`<button class="btn primary" onclick="openTransaction()">＋ إضافة عملية</button>`)}
 <section class="cards">
 <div class="card"><div class="label">💵 إجمالي الدخل</div><strong class="green">${money(t.income)}</strong><div class="small muted">كل الفترات</div></div>
 <div class="card"><div class="label">💸 إجمالي المصروفات</div><strong class="red">${money(t.expense)}</strong><div class="small muted">كل الفترات</div></div>
 <div class="card"><div class="label">👛 رصيد الحسابات</div><strong>${money(balance)}</strong><div class="small muted">الأرصدة الحالية</div></div>
 <div class="card"><div class="label">📅 صافي الشهر</div><strong class="${mt.income-mt.expense>=0?'green':'red'}">${money(mt.income-mt.expense)}</strong><div class="small muted">دخل الشهر − مصروفه</div></div>
 </section>
 <div class="grid2"><div class="panel"><h3>⚡ إجراءات سريعة</h3><div class="quick"><button onclick="openTransaction('income')"><span>🟢</span>إضافة دخل</button><button onclick="openTransaction('expense')"><span>🔴</span>إضافة مصروف</button><button onclick="openTransaction('transfer')"><span>🔁</span>تحويل</button></div><div style="height:16px"></div><div class="row"><b>حساباتك</b><button class="btn light" onclick="go('accounts')">عرض الكل</button></div>${db.accounts.map(a=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(a.name)}</span><b>${money(accountBalance(a.id))}</b></div>`).join('')}</div>
 <div class="panel"><h3>📆 ملخص الشهر الحالي</h3><div class="row"><span class="muted">الدخل</span><b class="green">${money(mt.income)}</b></div><div class="bar"><span style="width:${mt.income+mt.expense?mt.income/(mt.income+mt.expense)*100:0}%"></span></div><div class="row" style="margin-top:15px"><span class="muted">المصروف</span><b class="red">${money(mt.expense)}</b></div><div class="bar"><span style="width:${mt.income+mt.expense?mt.expense/(mt.income+mt.expense)*100:0}%;background:#e47b7b"></span></div><div class="notice">الأرصدة تُحسب من الرصيد الافتتاحي والعمليات والتحويلات المسجلة.</div><div class="row"><span>عدد العمليات</span><b>${month.length}</b></div></div></div>
 <div class="panel" style="margin-top:14px"><div class="row"><h3>🕘 أحدث العمليات</h3><button class="btn light" onclick="go('transactions')">كل العمليات</button></div>${recent.length?tableRows(recent):'<div class="empty">لا توجد عمليات حتى الآن. ابدأ بإضافة أول دخل أو مصروف.</div>'}</div>
 ${db.migration?`<div class="notice">تم العثور على بيانات قديمة من ${esc(db.migration.from)} وتجهيز ${db.migration.count} عملية للترحيل. لم يتم حذف المصدر القديم.</div>`:''}`;
}
function tableRows(items){return `<div class="tablewrap"><table class="table"><thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>التصنيف</th><th>الحساب</th><th>المبلغ</th><th>إجراءات</th></tr></thead><tbody>${items.map(t=>`<tr><td>${esc(t.date||'')}</td><td><span class="pill ${t.type==='income'?'in':t.type==='expense'?'out':''}">${t.type==='income'?'دخل':t.type==='expense'?'مصروف':'تحويل'}</span></td><td>${esc(t.description||'تحويل')}</td><td>${esc(t.category||'—')}</td><td>${esc(accountName(t.accountId||t.from))}</td><td class="${t.type==='income'?'green':t.type==='expense'?'red':''}"><b>${money(t.amount)}</b></td><td><div class="actions"><button class="iconbtn" onclick="editTransaction('${esc(t.id)}')">✏️</button><button class="iconbtn" onclick="deleteTransaction('${esc(t.id)}')">🗑️</button></div></td></tr>`).join('')}</tbody></table></div>`}
function accountName(id){return db.accounts.find(a=>a.id===id)?.name||'—'}
function transactionsHTML(){const sorted=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date));return `${pageHead('العمليات','كل حركات الدخل والمصروف والتحويلات',`<button class="btn primary" onclick="openTransaction()">＋ إضافة عملية</button>`)}<div class="filters"><input id="searchTx" placeholder="ابحث بالوصف أو التصنيف..." oninput="filterTx()"><select id="typeTx" onchange="filterTx()"><option value="">كل الأنواع</option><option value="income">دخل</option><option value="expense">مصروف</option><option value="transfer">تحويل</option></select><input type="month" id="monthTx" onchange="filterTx()"></div><div id="txResults">${sorted.length?tableRows(sorted):'<div class="panel empty">لا توجد عمليات مسجلة.</div>'}</div>`}
function filterTx(){let q=$('searchTx').value.trim().toLowerCase(),type=$('typeTx').value,month=$('monthTx').value;let a=[...db.transactions].filter(t=>(!q||(t.description+' '+t.category).toLowerCase().includes(q))&&(!type||t.type===type)&&(!month||t.date.startsWith(month))).sort((x,y)=>y.date.localeCompare(x.date));$('txResults').innerHTML=a.length?tableRows(a):'<div class="panel empty">لا توجد نتائج مطابقة.</div>'}
function accountsHTML(){return `${pageHead('الحسابات والخزائن','تابع أموالك موزعة على النقدية والبنك والمحافظ',`<button class="btn primary" onclick="openAccount()">＋ حساب جديد</button>`)}<div class="cards">${db.accounts.map(a=>`<div class="card"><div class="label">👛 ${esc(a.name)}</div><strong>${money(accountBalance(a.id))}</strong><div class="small muted">رصيد افتتاحي: ${money(a.opening)}</div><div class="actions" style="margin-top:10px"><button class="btn light" onclick="openAccount('${a.id}')">تعديل</button>${db.accounts.length>1?`<button class="btn danger" onclick="deleteAccount('${a.id}')">حذف</button>`:''}</div></div>`).join('')}</div><div class="panel"><h3>التحويل بين الحسابات</h3><p class="muted small">التحويل لا يُحسب دخلًا أو مصروفًا؛ فقط ينقل الرصيد بين حساباتك.</p><button class="btn primary" onclick="openTransaction('transfer')">إجراء تحويل</button></div>`}
function budgetsHTML(){return `${pageHead('الميزانيات','حدد سقفًا شهريًا لكل نوع من المصروفات',`<button class="btn primary" onclick="openBudget()">＋ ميزانية جديدة</button>`)}${db.budgets.length?db.budgets.map(b=>{let spent=db.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0),pct=Math.min(100,spent/b.limit*100);return `<div class="panel" style="margin-bottom:10px"><div class="row"><b>${esc(b.category)}</b><b>${money(spent)} / ${money(b.limit)}</b></div><div class="bar"><span style="width:${pct}%;background:${pct>=100?'var(--red)':'var(--green)'}"></span></div><div class="row small muted" style="margin-top:7px"><span>${pct.toFixed(0)}% مستخدم</span><button class="iconbtn" onclick="deleteBudget('${b.id}')">حذف</button></div></div>`}).join(''):'<div class="panel empty">لم تضف ميزانيات بعد.</div>'}`}
function debtsHTML(){return `${pageHead('الديون','اضغط على اسم الشخص لمشاهدة الأقساط والمدفوع والمتبقي',`<button class="btn primary" onclick="openDebt()">＋ تسجيل دين</button>`)}${db.debts.length?`<div class="cards"><div class="card"><div class="label">مبالغ لك</div><strong class="green">${money(db.debts.filter(d=>d.direction==='owed_to_me').reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0))}</strong></div><div class="card"><div class="label">مبالغ عليك</div><strong class="red">${money(db.debts.filter(d=>d.direction==='i_owe').reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0))}</strong></div></div>${db.debts.map(d=>`<div class="panel" style="margin-bottom:9px"><div class="row"><button class="linkname" style="border:0;background:none;padding:0;color:var(--green);font-weight:800;text-decoration:underline;font-size:16px" onclick="openDebtDetails('${d.id}')">${esc(d.person)}</button><span class="pill ${d.direction==='owed_to_me'?'in':'out'}">${d.direction==='owed_to_me'?'لك عنده':'عليك له'}</span></div><div class="row" style="margin:10px 0"><span class="muted small">الأصل: ${money(d.amount)} • المدفوع: ${money(d.paid)}</span><b>المتبقي: ${money(Math.max(0,d.amount-d.paid))}</b></div>${d.note?`<div class="small muted">${esc(d.note)}</div>`:''}<div class="actions" style="margin-top:10px"><button class="btn light" onclick="payDebt('${d.id}')">＋ تسجيل قسط</button><button class="btn mutedbtn" onclick="openDebtDetails('${d.id}')">التفاصيل</button><button class="btn danger" onclick="deleteDebt('${d.id}')">حذف</button></div></div>`).join('')}`:'<div class="panel empty">لا توجد ديون مسجلة.</div>'}` }
function reportsHTML(){let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7),arr=db.transactions.filter(t=>t.date.startsWith(key)),tt=totals(arr);months.push({key,label:d.toLocaleDateString('ar-EG',{month:'short'}),...tt});}let max=Math.max(1,...months.flatMap(m=>[m.income,m.expense]));return `${pageHead('التقارير والتحليلات','مقارنة الدخل والمصروف خلال آخر 6 أشهر',`<button class="btn light" onclick="exportCSV()">تصدير Excel (CSV)</button>`)}<div class="panel"><h3>الدخل والمصروف شهريًا</h3><div class="chart">${months.map(m=>`<div class="chartcol"><div class="chartbars"><i class="ci" style="height:${m.income/max*100}%"></i><i class="co" style="height:${m.expense/max*100}%"></i></div><small>${m.label}</small></div>`).join('')}</div><div class="row small muted" style="justify-content:center;gap:18px;margin-top:12px"><span class="green">■ الدخل</span><span class="red">■ المصروف</span></div></div><div class="cards" style="margin-top:14px"><div class="card"><div class="label">إجمالي الدخل</div><strong class="green">${money(totals().income)}</strong></div><div class="card"><div class="label">إجمالي المصروف</div><strong class="red">${money(totals().expense)}</strong></div><div class="card"><div class="label">صافي الفرق</div><strong>${money(totals().income-totals().expense)}</strong></div><div class="card"><div class="label">عدد العمليات</div><strong>${db.transactions.length}</strong></div></div><div class="panel"><h3>ملخص الأشهر</h3>${months.map(m=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${m.label} ${m.key}</span><span><b class="green">${money(m.income)}</b> / <b class="red">${money(m.expense)}</b></span></div>`).join('')}</div>`}
function settingsHTML(){return `${pageHead('الإعدادات','إدارة بيانات التطبيق والنسخ الاحتياطية')}<div class="panel"><h3>💾 التخزين المحلي</h3><p class="muted small">البيانات محفوظة داخل المتصفح على هذا الجهاز. لا يتم إرسالها إلى أي خادم.</p><div class="notice">مسح بيانات المتصفح أو تغيير المتصفح أو الجهاز قد يؤدي لفقدان البيانات. احتفظ بنسخة احتياطية بانتظام.</div><div class="actions"><button class="btn primary" onclick="exportBackup()">تنزيل نسخة احتياطية كاملة</button><button class="btn light" onclick="document.getElementById('restoreFile').click()">استرجاع نسخة</button></div></div><div class="panel" style="margin-top:12px"><div class="row"><h3>🏷️ إدارة خانات الدخل والمصروف</h3><button class="btn primary" onclick="addCategory()">＋ إضافة خانة</button></div><p class="small muted">أضف خانات تناسب استخدامك مثل مواشي أو ردة أو أرض زراعية برسيم.</p><div class="grid2"><div><b>خانات الدخل</b><div id="incomeCats"></div></div><div><b>خانات المصروف</b><div id="expenseCats"></div></div></div></div><div class="panel" style="margin-top:12px"><h3>♻️ بيانات الإصدار القديم</h3><p class="small muted">${db.migration?`تم تجهيز ${db.migration.count} عملية قديمة من ${esc(db.migration.from)}.`:'لم يتم تسجيل عملية ترحيل قديمة في هذه النسخة.'}</p><p class="small muted">لم نحذف مفاتيح التخزين القديمة. احتفظ بها حتى تتأكد من ظهور كل بياناتك.</p></div><div class="panel" style="margin-top:12px"><h3>⚠️ إعادة ضبط التطبيق</h3><p class="small muted">هذا الإجراء يمسح بيانات مصاريفي PRO من المتصفح الحالي فقط.</p><button class="btn danger" onclick="resetApp()">مسح بيانات PRO</button></div>`}
function openModal(html){$('dialog').innerHTML=html;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open');editingId=null}
function openTransaction(type='expense',id=null){let t=id?db.transactions.find(x=>x.id===id):null;editingId=id;type=t?.type||type;let opts=db.accounts.map(a=>`<option value="${a.id}" ${t?.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('');let categories=['راتب','طعام وشراب','مواصلات','فواتير','صحة','تعليم','تسوق','ترفيه','سكن','هدايا','استثمار','أخرى','غير مصنف'];openModal(`<h2>${t?'تعديل العملية':'إضافة عملية جديدة'}</h2><div class="field"><label>نوع العملية</label><select id="fType" onchange="toggleTransferFields()"><option value="income" ${type==='income'?'selected':''}>دخل</option><option value="expense" ${type==='expense'?'selected':''}>مصروف</option><option value="transfer" ${type==='transfer'?'selected':''}>تحويل بين حسابات</option></select></div><div class="field"><label>المبلغ بالجنيه</label><input id="fAmount" type="number" min="0.01" step="0.01" value="${t?.amount??''}" placeholder="مثال: 250"></div><div class="field" id="descField"><label>البيان / الوصف</label><input id="fDesc" value="${esc(t?.description||'')}" placeholder="مثال: مشتريات المنزل"></div><div class="field" id="catField"><label>التصنيف</label><div class="row"><select id="fCategory" style="flex:1">${categoryOptions(type,t?.category)}</select><button type="button" class="btn light" onclick="addCategoryFromForm()">＋ جديد</button></div></div><div class="field" id="accountField"><label>الحساب</label><select id="fAccount">${opts}</select></div><div class="field hidden" id="fromField"><label>من حساب</label><select id="fFrom">${opts}</select></div><div class="field hidden" id="toField"><label>إلى حساب</label><select id="fTo">${opts}</select></div><div class="field"><label>التاريخ</label><input id="fDate" type="date" value="${t?.date||today()}"></div><div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNote" rows="2">${esc(t?.note||'')}</textarea></div><div class="dialogfoot"><button class="btn primary" onclick="saveTransaction()">حفظ العملية</button><button class="btn mutedbtn" onclick="closeModal()">إلغاء</button></div>`);toggleTransferFields();}
function categoryOptions(type,selected=''){let kind=type==='income'?'income':'expense',arr=db.settings.categories?.[kind]||[];if(selected&&!arr.includes(selected))arr=[selected,...arr];return arr.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function refreshCategoryOptions(selected=''){if($('fCategory'))$('fCategory').innerHTML=categoryOptions($('fType').value,selected)}
function toggleTransferFields(){let tr=$('fType').value==='transfer';$('descField').classList.toggle('hidden',tr);$('catField').classList.toggle('hidden',tr);$('accountField').classList.toggle('hidden',tr);$('fromField').classList.toggle('hidden',!tr);$('toField').classList.toggle('hidden',!tr);if(!tr)refreshCategoryOptions()}
function addCategoryFromForm(){let type=$('fType').value;if(type==='transfer')return;let key=type==='income'?'income':'expense',name=prompt('اكتب اسم الخانة الجديدة:');if(!name||!name.trim())return;name=name.trim();if(!db.settings.categories[key].includes(name))db.settings.categories[key].push(name);save();refreshCategoryOptions(name)}
function saveTransaction(){let type=$('fType').value,amount=Number($('fAmount').value),date=$('fDate').value;if(!Number.isFinite(amount)||amount<=0||!date)return alert('أدخل مبلغًا صحيحًا وتاريخًا.');let obj={id:editingId||uid(),type,amount,date,createdAt:new Date().toISOString(),note:$('fNote').value.trim()};if(type==='transfer'){obj.from=$('fFrom').value;obj.to=$('fTo').value;if(!obj.from||!obj.to||obj.from===obj.to)return alert('اختر حسابين مختلفين للتحويل.');obj.description='تحويل بين الحسابات';obj.category='تحويل';}else{obj.description=$('fDesc').value.trim()||'بدون وصف';obj.category=$('fCategory').value;obj.accountId=$('fAccount').value;}if(editingId){let i=db.transactions.findIndex(x=>x.id===editingId);db.transactions[i]=obj;}else db.transactions.push(obj);save();closeModal();renderPage();}
function editTransaction(id){let t=db.transactions.find(x=>x.id===id);if(t)openTransaction(t.type,id)}
function deleteTransaction(id){if(confirm('هل تريد حذف هذه العملية؟')){db.transactions=db.transactions.filter(t=>t.id!==id);save();renderPage()}}
function openAccount(id=null){let a=id?db.accounts.find(x=>x.id===id):null;openModal(`<h2>${a?'تعديل حساب':'إضافة حساب جديد'}</h2><div class="field"><label>اسم الحساب</label><input id="aName" value="${esc(a?.name||'')}" placeholder="مثال: محفظة إلكترونية"></div><div class="field"><label>نوع الحساب</label><select id="aType"><option value="cash" ${a?.type==='cash'?'selected':''}>نقدية</option><option value="bank" ${a?.type==='bank'?'selected':''}>بنك</option><option value="wallet" ${a?.type==='wallet'?'selected':''}>محفظة إلكترونية</option><option value="other" ${a?.type==='other'?'selected':''}>أخرى</option></select></div><div class="field"><label>الرصيد الافتتاحي</label><input id="aOpening" type="number" step="0.01" value="${a?.opening??0}"></div><div class="dialogfoot"><button class="btn primary" onclick="saveAccount('${id||''}')">حفظ</button><button class="btn mutedbtn" onclick="closeModal()">إلغاء</button></div>`)}
function saveAccount(id){let name=$('aName').value.trim(),opening=Number($('aOpening').value);if(!name||!Number.isFinite(opening))return alert('أدخل اسمًا ورصيدًا صحيحًا.');if(id){let a=db.accounts.find(x=>x.id===id);a.name=name;a.type=$('aType').value;a.opening=opening;}else db.accounts.push({id:uid(),name,type:$('aType').value,opening});save();closeModal();renderPage()}
function deleteAccount(id){if(db.transactions.some(t=>t.accountId===id||t.from===id||t.to===id))return alert('لا يمكن حذف حساب مرتبط بعمليات.');if(confirm('حذف الحساب؟')){db.accounts=db.accounts.filter(a=>a.id!==id);save();renderPage()}}
function openBudget(){openModal(`<h2>ميزانية شهرية جديدة</h2><div class="field"><label>التصنيف</label><select id="bCat">${['طعام وشراب','مواصلات','فواتير','صحة','تعليم','تسوق','ترفيه','سكن','أخرى'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>الحد الشهري بالجنيه</label><input id="bLimit" type="number" min="1"></div><div class="dialogfoot"><button class="btn primary" onclick="saveBudget()">حفظ</button><button class="btn mutedbtn" onclick="closeModal()">إلغاء</button></div>`)}
function saveBudget(){let category=$('bCat').value,limit=Number($('bLimit').value);if(limit<=0)return alert('أدخل مبلغًا صحيحًا.');db.budgets=db.budgets.filter(b=>b.category!==category);db.budgets.push({id:uid(),category,limit});save();closeModal();renderPage()}
function deleteBudget(id){if(confirm('حذف الميزانية؟')){db.budgets=db.budgets.filter(b=>b.id!==id);save();renderPage()}}
function openDebt(){openModal(`<h2>تسجيل دين</h2><div class="field"><label>اسم الشخص</label><input id="dPerson"></div><div class="field"><label>نوع الدين</label><select id="dDirection"><option value="owed_to_me">مبلغ لي عند شخص</option><option value="i_owe">مبلغ عليّ لشخص</option></select></div><div class="field"><label>المبلغ</label><input id="dAmount" type="number" min="0.01" step="0.01"></div><div class="field"><label>ملاحظات</label><input id="dNote"></div><div class="dialogfoot"><button class="btn primary" onclick="saveDebt()">حفظ</button><button class="btn mutedbtn" onclick="closeModal()">إلغاء</button></div>`)}
function saveDebt(){let person=$('dPerson').value.trim(),amount=Number($('dAmount').value);if(!person||amount<=0)return alert('أدخل الاسم والمبلغ.');db.debts.push({id:uid(),person,direction:$('dDirection').value,amount,paid:0,payments:[],note:$('dNote').value.trim(),date:today()});save();closeModal();renderPage()}
function payDebt(id){let d=db.debts.find(x=>x.id===id);if(!d)return;let left=Math.max(0,d.amount-d.paid);if(left<=0)return alert('تم سداد الدين بالكامل.');let raw=prompt('أدخل مبلغ القسط بالجنيه. المتبقي: '+money(left));if(raw===null)return;let n=Number(raw);if(!Number.isFinite(n)||n<=0||n>left)return alert('مبلغ السداد غير صحيح، ويجب ألا يتجاوز المتبقي.');d.payments=Array.isArray(d.payments)?d.payments:[];d.payments.push({id:uid(),amount:n,date:today()});d.paid=Number(d.paid||0)+n;save();openDebtDetails(id)}
function openDebtDetails(id){let d=db.debts.find(x=>x.id===id);if(!d)return;let paid=Number(d.paid)||0,left=Math.max(0,Number(d.amount)-paid),payments=Array.isArray(d.payments)?d.payments:[];let history=payments.length?payments.slice().reverse().map((p,i)=>`<div class="row account"><span><b>القسط ${payments.length-i}</b><small class="muted" style="display:block">${esc(p.date||'تاريخ غير مسجل')}</small></span><b class="green">${money(p.amount)}</b></div>`).join(''):(paid>0?`<div class="notice">تم تسجيل ${money(paid)} كمدفوع من إصدار سابق، لكن تفاصيل الأقساط القديمة غير متوفرة. الأقساط الجديدة ستظهر هنا بالتاريخ والمبلغ.</div>`:'<div class="empty">لم يتم تسجيل أي أقساط حتى الآن.</div>');openModal(`<h2>تفاصيل حساب: ${esc(d.person)}</h2><div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="card"><div class="label">إجمالي الدين</div><strong>${money(d.amount)}</strong></div><div class="card"><div class="label">${d.direction==='owed_to_me'?'المبلغ اللي استلمته':'المبلغ اللي سددته'}</div><strong class="green">${money(paid)}</strong></div><div class="card" style="grid-column:1/-1"><div class="label">المتبقي ${d.direction==='owed_to_me'?'لك عنده':'عليك له'}</div><strong class="${left>0?'red':'green'}">${money(left)}</strong></div></div><div class="row" style="margin:16px 0 8px"><b>سجل الأقساط</b><span class="small muted">${payments.length} قسط</span></div>${history}${d.note?`<div class="notice">ملاحظات: ${esc(d.note)}</div>`:''}<div class="dialogfoot"><button class="btn primary" onclick="payDebt('${d.id}')" ${left<=0?'disabled':''}>＋ تسجيل قسط</button><button class="btn mutedbtn" onclick="closeModal()">إغلاق</button></div>`)}
function deleteDebt(id){if(confirm('حذف سجل الدين؟')){db.debts=db.debts.filter(d=>d.id!==id);save();renderPage()}}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='masarefy-pro-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.transactions)||!Array.isArray(x.accounts))throw 0;if(confirm('استرجاع النسخة سيستبدل بيانات مصاريفي PRO الحالية. هل تريد المتابعة؟')){db={...defaultDB(),...x};save();renderPage();alert('تم الاسترجاع بنجاح.')}}catch(err){alert('ملف النسخة غير صالح أو ليس نسخة مصاريفي PRO.')}e.target.value=''};r.readAsText(f)}
function exportCSV(){let rows=[['التاريخ','النوع','الوصف','التصنيف','الحساب','المبلغ','ملاحظات'],...db.transactions.map(t=>[t.date,t.type==='income'?'دخل':t.type==='expense'?'مصروف':'تحويل',t.description||'',t.category||'',accountName(t.accountId||t.from),t.amount,t.note||''])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='masarefy-transactions-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function addCategory(){let kind=prompt('اكتب نوع الخانة: دخل أو مصروف');if(!kind)return;kind=kind.trim();let key=(kind==='دخل'||kind.toLowerCase()==='income')?'income':(kind==='مصروف'||kind.toLowerCase()==='expense')?'expense':null;if(!key)return alert('اكتب دخل أو مصروف.');let name=prompt('اكتب اسم الخانة الجديدة:');if(!name||!name.trim())return;name=name.trim();if(db.settings.categories[key].includes(name))return alert('الخانة موجودة بالفعل.');db.settings.categories[key].push(name);save();renderPage()}
function removeCategory(kind,name){if(!confirm('حذف الخانة من القوائم؟ العمليات القديمة ستحتفظ بالتصنيف المسجل.'))return;db.settings.categories[kind]=db.settings.categories[kind].filter(x=>x!==name);save();renderPage()}
function renderCategoryLists(){let make=(kind)=>db.settings.categories[kind].map(c=>`<div class="row account"><span>${esc(c)}</span><button class="btn danger" onclick="removeCategory('${kind}',${JSON.stringify(c)})">حذف</button></div>`).join('');if($('incomeCats'))$('incomeCats').innerHTML=make('income');if($('expenseCats'))$('expenseCats').innerHTML=make('expense')}
function resetApp(){if(confirm('تنبيه: سيتم حذف بيانات PRO من هذا المتصفح. هل أنت متأكد؟')){localStorage.removeItem(DBKEY);db=defaultDB();save();go('home')}}
function renderPageSafe(){renderPage()}
renderPage();
</script>

    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('تعذر تجهيز وضع عدم الاتصال:', err);
    });
  });
}
